server.port=${PORT:8081}
spring.datasource.url=${TRUSTVAULT_DB_URL:jdbc:mysql://localhost:3306/trustvault}
spring.datasource.username=${TRUSTVAULT_DB_USERNAME:trustvault_app}
spring.datasource.password=${TRUSTVAULT_DB_PASSWORD}
spring.servlet.multipart.max-file-size=5242880B
spring.servlet.multipart.max-request-size=6291456B
spring.servlet.multipart.resolve-lazily=true
# Keep upload timestamps and inclusive date-search boundaries consistent.
spring.datasource.hikari.data-source-properties[connectionTimeZone]=UTC
spring.datasource.hikari.data-source-properties[forceConnectionTimeZoneToSession]=true
