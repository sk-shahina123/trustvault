<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity audit | TrustVault</title>
    <link rel="stylesheet" href="/security-pages.css">
    <script src="/audit.js" defer></script>
</head>
<body><main>
    <nav><a href="/">Documents</a> · <a href="/logout">Sign out</a></nav>
    <h1>Activity audit</h1>
    <p>Uploads, access attempts, document changes and permission changes. Administrators can review activity; this does not grant access to document contents.</p>
    <button id="refresh" type="button">Latest events</button>
    <button id="older" type="button" disabled>Older events</button>
    <p id="status" role="status">Loading…</p>
    <div class="table-scroll"><table>
        <thead><tr><th>ID</th><th>Time</th><th>Account</th><th>Document ID</th><th>Action</th><th>Result</th><th>Details</th></tr></thead>
        <tbody id="events"></tbody>
    </table></div>
</main></body></html>
