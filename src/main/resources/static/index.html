<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #17233b;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 520px;
            margin: 60px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
        }

        button {
            background: #1d4ed8;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main>
        <h1>TrustVault</h1>
        <p id="accountMessage" role="status">Loading account details...</p>
<p><a href="/logout">Sign out</a></p>
        <p>Check the connection to your TrustVault server.</p>

        <button id="checkButton" type="button">
            Check connection
        </button>

        <p id="statusMessage" role="status">
            Connection not checked yet.
        </p>
    </main>

    <script>
    const accountMessage = document.getElementById("accountMessage");
    const button = document.getElementById("checkButton");
    const message = document.getElementById("statusMessage");

    async function getResponse(url, expectedType) {
        let response;

        try {
            response = await fetch(url, {
                headers: { Accept: expectedType },
                cache: "no-store"
            });
        } catch (error) {
            throw new Error(
                "Cannot reach TrustVault. Check that the application is running."
            );
        }

        const wentToLogin = response.redirected &&
            new URL(response.url).pathname === "/login";

        if (response.status === 401 || wentToLogin) {
            window.location.assign("/login");
            return null;
        }

        if (response.status === 403) {
            throw new Error("You do not have permission for this action.");
        }

        if (!response.ok) {
            throw new Error(
                "TrustVault could not complete the request (HTTP " +
                response.status + ")."
            );
        }

        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes(expectedType)) {
            throw new Error("TrustVault returned an unexpected response.");
        }

        return response;
    }

    async function loadAccount() {
        try {
            const response = await getResponse(
                "/api/me", "application/json"
            );

            if (response === null) {
                return;
            }

            const account = await response.json();

            accountMessage.textContent =
                "Signed in as " + account.email +
                " | Role: " + account.role;
        } catch (error) {
            accountMessage.textContent = error.message;
        }
    }

    button.addEventListener("click", async function () {
        message.textContent = "Checking...";
        button.disabled = true;

        try {
            const response = await getResponse(
                "/api/health", "text/plain"
            );

            if (response !== null) {
                message.textContent = await response.text();
            }
        } catch (error) {
            message.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    });

    loadAccount();
</script>
</body>
</html>
