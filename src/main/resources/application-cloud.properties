server.port=${PORT:8081}

spring.datasource.url=${TRUSTVAULT_DB_URL}
spring.datasource.username=${TRUSTVAULT_DB_USERNAME:trustvault_app}
spring.datasource.password=${TRUSTVAULT_DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.datasource.hikari.data-source-properties[sslMode]=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties[trustCertificateKeyStoreUrl]=file:./certs/aiven-truststore.p12
spring.datasource.hikari.data-source-properties[trustCertificateKeyStoreType]=PKCS12
spring.datasource.hikari.data-source-properties[trustCertificateKeyStorePassword]=changeit
spring.datasource.hikari.data-source-properties[fallbackToSystemTrustStore]=false